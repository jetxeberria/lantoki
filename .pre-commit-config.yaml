# Checks run before every push, installed by `just install-hooks`.
# The hook reuses `just check`, so tool versions come from pdm.lock.
# The Git LFS pre-push hook keeps running: pre-commit chains it (pre-push.legacy).
default_install_hook_types: [pre-push]
default_stages: [pre-push]

repos:
  - repo: local
    hooks:
      - id: check
        name: just check (formatting, linters, tests)
        entry: just check
        language: system
        pass_filenames: false
        always_run: true
