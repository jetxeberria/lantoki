[project]
name = "lantoki"
version = "0.1.0"
description = "Single entry point for AI coding-assistant customization, mapped to every harness (GitHub Copilot, Claude Code, ...)"
authors = [
    {name = "jetxeberria", email = "etxeberria_92@hotmail.com"},
]
requires-python = ">=3.15"
readme = "README.md"
license = {text = "MIT"}
keywords = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
]

# Runtime dependencies: owned by the project (`just add <package>`)
dependencies = [
    "dynaconf>=3.2.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/jetxeberria/lantoki"
Documentation = "https://github.com/jetxeberria/lantoki#readme"
Changelog = "https://github.com/jetxeberria/lantoki/-/blob/master/CHANGELOG.md"
Issues = "https://github.com/jetxeberria/lantoki/-/issues"

[project.scripts]
lantoki = "lantoki.cli:app"

[dependency-groups]
# Owned by the galtzagorri template: tools its recipes need, as minimum versions.
# `just update` merges template changes here; do not edit these lines. To need a
# newer version of one of them, add a higher floor to the `dev` group instead.
base = [
    "copier>=9.4",
    "pre-commit>=4.7",
    "pytest>=8.3",
    "ruff>=0.12",
    "yamllint>=1.35",
]

# Development dependencies: owned by the project (`just add -dG dev <package>`)
dev = [
    "bandit>=1.7.0",
    "coverage[toml]>=7.4.0",
    "pytest-cov>=4.1",
    "pytest-html>=4.0",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.3",
    "tomli-w>=1.2.0",
]

# Documentation site (`just docs`): owned by the project
docs = [
    "griffe-typingdoc>=0.2.4",
    "markdown-callouts>=0.3",
    "markdown-exec>=1.7",
    "mkdocs>=1.5",
    "mkdocs-autorefs>=0.5.0",
    "mkdocs-awesome-pages-plugin>=2.9.2",
    "mkdocs-build-plantuml-plugin>=1.9.0",
    "mkdocs-coverage>=1.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-git-committers-plugin-2>=1.2",
    "mkdocs-include-markdown-plugin>=6.0",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-material>=9.4",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "mkdocs-minify-plugin>=0.7",
    "mkdocs-render-swagger-plugin>=0.1.1",
    "mkdocs-site-urls>=0.2.0",
    "mkdocstrings[python]>=0.23",
    "mkdocstrings-python>=1.8.0",
    "typer>=0.9.0",
]

# Every project is a package (galtzagorri PKG-2): `just build`, then
# `just install-tool` or `just install-tool-editable` put [project.scripts] on PATH
[build-system]
requires = ["pdm-backend>=2.5"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true
plugins = ["pdm-bump"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# lantoki (QLT-1, DEV-4): coverage gate and reports on every `just test`;
# run one file with `just test --no-cov tests/test_x.py`
addopts = [
    "--cov=src",
    "--cov=customizations",
    "--cov-report=term-missing",
    "--cov-fail-under=75",
    "--cov-report=html:docs/_build/coverage/unit",
    "--cov-report=xml:docs/_build/coverage/unit/coverage.xml",
    "--html=docs/_build/test-reports/unit/index.html",
    "--junitxml=docs/_build/test-reports/unit/junit.xml",
]
junit_suite_name = "unit-test"
filterwarnings = [
    "ignore::pytest.PytestDeprecationWarning:pytest_bdd.*",
    "ignore::DeprecationWarning:structlog.threadlocal*:0"
]

[tool.coverage.run]
data_file = "docs/_build/coverage/test/.coverage"

# lantoki (DEV-4): Ruff ALL, 120 columns
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [ "ALL" ]
task-tags=[
    "TODO",
    "FIXME",
    "WARN"
]
ignore = [
    "PLR0913",  # too-many-arguments
    "TD003",    # missing-todo-link
    "COM812",   # missing-trailing-comma: conflicts with ruff format
    "CPY001",   # missing-copyright-notice: the LICENSE file covers the whole repo
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert is how pytest checks results
    "S108",     # tmp paths in fixtures are intentional
    "ARG001",   # pytest fixtures requested only for their side effects
    "FBT002",   # boolean defaults in test helpers
    "PLR2004",  # literal expected values in assertions
    "D103",     # Given-When-Then test names are self-documenting
    "S603",     # tests run the installer script with sys.executable
    "PLR0917",  # pytest injects fixtures and parameters positionally
]
# MCP server scripts are standalone files, not packages (SRC-9)
"customizations/*/mcp/*/server.py" = ["INP001"]
# Owned by the galtzagorri template (DEV-1): kept as rendered, not edited here
"tests/test_package.py" = [
    "D100",     # undocumented-public-module
    "ANN201",   # missing-return-type-public-function
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "pep257"
