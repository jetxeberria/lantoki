[project]
name = "lantoki"
version = "0.1.0"
description = "Single entry point for AI coding-assistant customization, mapped to every harness (GitHub Copilot, Claude Code, ...)"
authors = [{name = "jetxeberria", email = "etxeberria_92@hotmail.com"}]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "dynaconf>=3.2.0",
    "mcp>=2",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/jetxeberria/lantoki"
Documentation = "https://github.com/jetxeberria/lantoki#readme"
Changelog = "https://github.com/jetxeberria/lantoki/-/blob/master/CHANGELOG.md"
Issues = "https://github.com/jetxeberria/lantoki/-/issues"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
[project.scripts]
lantoki = "lantoki.cli:app"
python-verification-gate = "lantoki.python_verification_gate:main"

[dependency-groups]
dev = [
    "bandit>=1.7.0",
    "coverage[toml]>=7.4.0",
    "pre-commit>=4.2.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-html>=4.0",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.3",
    "ruff>=0.1.11",
    "tomli-w>=1.2.0",
]

docs = [
    "griffe-typingdoc>=0.2.4",
    "markdown-callouts>=0.3",
    "markdown-exec>=1.7",
    "mkdocs>=1.5",
    "mkdocs-autorefs>=0.5.0",
    "mkdocs-awesome-pages-plugin>=2.9.2",
    "mkdocs-build-plantuml-plugin>=1.9.0",
    "mkdocs-coverage>=1.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-git-committers-plugin-2>=1.2",
    "mkdocs-include-markdown-plugin>=6.0",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-material>=9.4",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "mkdocs-minify-plugin>=0.7",
    "mkdocs-render-swagger-plugin>=0.1.1",
    "mkdocs-site-urls>=0.2.0",
    "mkdocstrings[python]>=0.23",
    "mkdocstrings-python>=1.8.0",
    "typer>=0.9.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

# Primary internal index
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources]
mkdocs = { index = "pypi" }
mkdocs-material = { index = "pypi" }
mkdocs-awesome-pages-plugin = { index = "pypi" }
mkdocs-site-urls = { index = "pypi" }

[tool.commitizen]  # https://commitizen-tools.github.io/commitizen/config/
bump_message = "bump(release): v$current_version → v$new_version"
tag_format = "v$version"
update_changelog_on_bump = false
version_provider = "pep621"
version_files = [
    "pyproject.toml:^version"
]
annotated_tag = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pytest.PytestDeprecationWarning:pytest_bdd.*",
    "ignore::DeprecationWarning:structlog.threadlocal*:0"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [ "ALL" ]
task-tags=[
    "TODO",
    "FIXME",
    "WARN"
]
ignore = [
    "PLR0913",  # too-many-arguments
    "TD003",    # missing-todo-link
    "COM812",   # missing-trailing-comma: conflicts with ruff format
    "CPY001",   # missing-copyright-notice: the LICENSE file covers the whole repo
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert is how pytest checks results
    "S108",     # tmp paths in fixtures are intentional
    "ARG001",   # pytest fixtures requested only for their side effects
    "FBT002",   # boolean defaults in test helpers
    "PLR2004",  # literal expected values in assertions
    "D103",     # Given-When-Then test names are self-documenting
    "S603",     # tests run the installer script with sys.executable
    "PLR0917",  # pytest injects fixtures and parameters positionally
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "pep257"
